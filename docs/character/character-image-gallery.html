<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>내Law남불 이미지 갤러리</title>
<style>
:root{--bg:#faf8f3;--fg:#222;--mute:#777;--card:#fff;--bd:#e4dfd3;--ac:#c2410c;--chk1:#fff;--chk2:#eee;--sz:220px}
@media(prefers-color-scheme:dark){:root{--bg:#1b1a18;--fg:#eee;--mute:#999;--card:#262421;--bd:#3a3733;--ac:#fb923c;--chk1:#33312e;--chk2:#2a2826}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"Apple SD Gothic Neo","Pretendard",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);padding:12px 16px}
h1{margin:0 0 8px;font-size:18px}
h1 small{color:var(--mute);font-weight:400;font-size:13px;margin-left:8px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.row b{color:var(--mute);font-weight:500;font-size:12px;min-width:44px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:99px;padding:3px 11px;cursor:pointer;font:inherit;font-size:13px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
input[type=search]{border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 10px;font:inherit;width:240px;max-width:100%}
input[type=range]{width:120px}
main{padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--sz),1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:hidden;cursor:pointer}
.card:hover{border-color:var(--ac)}
.th{aspect-ratio:1;background:repeating-conic-gradient(var(--chk1) 0 25%,var(--chk2) 0 50%) 0 0/16px 16px;display:flex}
.th img{width:100%;height:100%;object-fit:contain}
.cap{padding:6px 8px;font-size:12px;word-break:break-all}
.cap i{display:block;color:var(--mute);font-style:normal;font-size:11px}
.empty{padding:40px;text-align:center;color:var(--mute)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;z-index:10;flex-direction:column;align-items:center;justify-content:center;padding:16px}
#lb.on{display:flex}
#lb .stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;background:none}
#lb img{max-width:100%;max-height:100%;object-fit:contain;background:repeating-conic-gradient(#fff 0 25%,#e6e6e6 0 50%) 0 0/20px 20px}
#lb .bar{color:#fff;margin-top:10px;text-align:center;font-size:13px;word-break:break-all}
#lb .bar button,#lb .bar a{color:#fff;background:#ffffff22;border:0;border-radius:6px;padding:4px 10px;margin:6px 3px 0;cursor:pointer;font:inherit;text-decoration:none;display:inline-block}
.nav{position:absolute;top:50%;transform:translateY(-50%);font-size:34px;color:#fff;background:#ffffff22;border:0;border-radius:8px;width:44px;height:64px;cursor:pointer}
#prev{left:10px}#next{right:10px}#x{position:absolute;top:10px;right:14px;font-size:28px;color:#fff;background:none;border:0;cursor:pointer}
</style>
</head>

<header>

  <div class="row"><input type="search" id="q" placeholder="파일명 검색 (예: hug, personality-06)">
    <b style="margin-left:8px">크기</b><input type="range" id="sz" min="120" max="420" value="220"></div>
  <div class="row"><b>캐릭터</b><span id="f-char"></span></div>
  <div class="row"><b>종류</b><span id="f-cat"></span></div>
  <div class="row"><label style="font-size:13px"><input type="checkbox" id="orig"> 원본 백업(_original) 포함</label></div>
</header>
<main><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>결과 없음</div></main>
<div id="lb"><button id="x">×</button><button class="nav" id="prev">‹</button><button class="nav" id="next">›</button>
  <div class="stage"><img id="lbimg" alt=""></div>

function info(p){
  const n=p.split("/").pop().replace(/\.png$/,"");
  const orig=p.includes("/_original/");

  let ch=Object.keys(CHARS).find(k=>base.startsWith(k+"_"))||"";

  if(base.startsWith("reenact-")) ch="reenact";
  let cat=orig?"original":base.startsWith("personality-")?"personality":base.startsWith("reenact-")?"reenact":/_icon_/.test(base)?"icon":/_standing/.test(base)?"standing":/_sheet/.test(base)?"sheet":"cut";

function chips(id,map,key){

    d.innerHTML='<div class="th"><img loading="lazy" decoding="async"></div><div class="cap"></div>';

    const c=d.querySelector(".cap");c.textContent=i.n;const s=document.createElement("i");s.textContent=i.p.replace(/\/[^/]+$/,"");c.appendChild(s);

  });

  $("#lbimg").src=u;$("#lbname").textContent=it.p+"  ("+(cur+1)+"/"+view.length+")";$("#lbopen").href=u;$("#lb").classList.add("on");}

$("#lb").onclick=e=>{if(e.target.id==="lb"||e.target.classList.contains("stage"))closeViewer()};
$("#lbcopy").onclick=async e=>{const u=BASE+encodeURI(view[cur].p);try{await navigator.clipboard.writeText(u);e.target.textContent="복사됨";}catch{e.target.textContent="복사 실패";}setTimeout(()=>e.target.textContent="URL 복사",1200)};
document.addEventListener("keydown",e=>{if(!$("#lb").classList.contains("on"))return;
  if(e.key==="Escape")closeViewer();if(e.key==="ArrowLeft")openAt(cur-1);if(e.key==="ArrowRight")openAt(cur+1);});
$("#q").oninput=e=>{st.q=e.target.value;render()};
$("#orig").onchange=e=>{st.orig=e.target.checked;render()};
$("#sz").oninput=e=>document.documentElement.style.setProperty("--sz",e.target.value+"px");
render();
