plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.team2'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// DB 스키마 마이그레이션 (Spring Boot 4는 Flyway 자동 설정이 별도 스타터로 분리됨)
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	// Flyway 10 이상은 PostgreSQL 지원 모듈이 따로 필요
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	// Swagger UI + OpenAPI 문서 (Spring Boot 4는 springdoc-openapi 3.x 필요)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

// 로컬 실행(./gradlew bootRun) 전용: Flyway 마이그레이션 위치를 자동으로 정한다 (BE-28)
// 셸 환경변수(FLYWAY_LOCATIONS)는 다른 터미널 · IDE에서 실행하면 빠지기 쉽고, 빠져도 오류 없이 시드 없이 떠서 알아채기 어렵다.
// - 기본: 스키마 + 가상 사건 시드(db/seed)
// - 비공개 서브모듈(private-seed/seed)에 SQL이 있으면 실제 사건도 넣는다 (권한이 없으면 빈 폴더라 자동으로 빠진다)
// - FLYWAY_LOCATIONS를 직접 주면 그 값을 그대로 쓴다
// 운영(jar · Docker) · 테스트는 이 설정을 쓰지 않는다 → application.yml 기본값(스키마만) 그대로
// 참고: doFirst에서 file(...) · System.getenv를 실행 시점에 읽으므로 Gradle 설정 캐시(org.gradle.configuration-cache=true)와는 맞지 않는다.
//       나중에 설정 캐시를 켜면 providers.environmentVariable(...) · layout.projectDirectory.dir(...)로 값을 미리 잡는 방식으로 바꾼다.
tasks.named('bootRun') {
	doFirst {
		def given = System.getenv('FLYWAY_LOCATIONS')
		def locations = given
		if (!given) {
			def realSeed = file('private-seed/seed')
			def realSeedFiles = realSeed.isDirectory() ? realSeed.listFiles({ f -> f.name.endsWith('.sql') } as FileFilter) : null
			locations = 'classpath:db/migration,classpath:db/seed'
			if (realSeedFiles) {
				// 절대 경로로 넘겨 실행 위치와 상관없이 같은 폴더를 읽게 한다
				locations += ",filesystem:${realSeed.absolutePath}"
			}
		}
		environment 'FLYWAY_LOCATIONS', locations
		def source = given ? '직접 지정' : '자동'
		// 직접 지정한 경우에는 실제 데이터 폴더 이름을 알 수 없으므로(예: filesystem:/srv/real-seed) 포함 여부를 추측하지 않는다
		def realCase = given ? '판정 안 함 (FLYWAY_LOCATIONS 직접 지정 — 지정한 위치를 그대로 사용)'
			: locations.contains('private-seed') ? '포함'
			: '없음 (backend/private-seed 서브모듈이 비어 있음 — 권한이 있으면 git submodule update --init backend/private-seed)'
		logger.lifecycle("[bootRun] Flyway 위치(${source}): ${locations}")
		logger.lifecycle("[bootRun] 실제 사건 시드: ${realCase}")
	}
}

// 실행 가능한 bootJar 하나만 만들도록 plain jar 생성을 끈다 (Dockerfile의 *.jar 복사가 한 파일만 잡도록)
tasks.named('jar') {
	enabled = false
}
