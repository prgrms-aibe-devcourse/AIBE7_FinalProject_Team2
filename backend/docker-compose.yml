# 로컬 개발용 PostgreSQL · Redis (backend 폴더에서 `docker compose up -d`)
# AWS 키 없이 로컬에서 개발이 끝나도록 DB를 컨테이너로 띄운다.
# 앱은 ./gradlew bootRun으로 실행한다. 가상 사건 시드(+ 서브모듈이 있으면 실제 사건)는 build.gradle이 자동으로 넣는다 (BE-28).
services:
  postgres:
    # pgvector가 포함된 PostgreSQL 이미지 (RAG 전환 대비)
    # 태그는 RDS에서 사용할 PostgreSQL 버전과 맞춘다. CI(backend-ci.yml)도 같은 태그를 쓴다.
    image: pgvector/pgvector:pg17
    container_name: lawnambul-postgres
    environment:
      POSTGRES_DB: lawnambul
      POSTGRES_USER: lawnambul
      POSTGRES_PASSWORD: lawnambul   # 로컬 전용 임시 비밀번호 (운영 비밀번호 아님)
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data   # 컨테이너를 지워도 데이터 유지
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lawnambul -d lawnambul"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # 캐시(DB 0) · 토큰 저장소(DB 1) (BE-61 · WBS 7.1.4, 기술 스택 2장 "Redis 운영 구성")
    # 운영(deploy/docker-compose.prod.yml)과 같은 영속화 · 축출 정책으로 띄워 차이를 줄인다. 로컬은 비밀번호만 생략
    image: redis:7.4-alpine
    container_name: lawnambul-redis
    command:
      - redis-server
      - --appendonly
      - "yes"                 # AOF 영속화: 재시작해도 토큰(DB 1)이 남는다
      - --appendfsync
      - everysec              # 1초마다 디스크에 기록 (최대 1초 유실)
      - --maxmemory
      - 200mb
      - --maxmemory-policy
      - noeviction            # 꽉 차도 키를 지우지 않는다 (토큰 보호). 대신 모든 키에 TTL 필수
    ports:
      # 내 컴퓨터에서만 접속한다. 로컬은 비밀번호가 없어 0.0.0.0으로 열면 같은 네트워크의 다른 기기도 붙을 수 있다 (BE-61 리뷰)
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data   # 컨테이너를 지워도 AOF 유지
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
