# Prometheus 스크레이프 설정 — 운영(모니터링 전용 EC2) (COMMON-43, WBS 7.2.4)
#
# ⚠️ **지금은 이 파일이 운영에서 쓰이지 않는다.** 운영 EC2는 1대뿐이고 별도 모니터링 서버를 두지
# 않기로 했다(COMMON-43 1순위 = Grafana Cloud). 7.3.3은 메인 EC2 안의 Alloy가 직접 scrape해서
# Grafana Cloud로 push하는 방식(deploy/alloy-agent.alloy)으로 가고, 경보 평가 · Alertmanager도
# 운영에서는 Grafana Cloud 쪽(Cloud Alerting)으로 옮긴다(PR #262 리뷰 9번, COMMON-62 논의) — 메인
# 서버가 죽으면 그 서버 안의 Alertmanager도 같이 죽어 정작 중요한 순간에 조용해지는 문제를 피하려는
# 것이다. 이 파일은 Cloud 경로가 막혔을 때(차선, v1.34) 전용 EC2를 실제로 만드는 경우에만 쓴다.
#
# 로컬(prometheus.yml)과 다른 점은 "대상이 같은 호스트가 아니다"는 것 하나다.
# 로컬: host.docker.internal:8081 · node-exporter:9100 (같은 머신 · 같은 Compose 네트워크)
# 운영: 메인 EC2의 사설 IP:8081 · :9100 (같은 VPC 안, 인터넷을 타지 않는다)
#
# 대상 주소를 이 파일에 직접 적지 않고 file_sd로 뺀 이유:
#   1. 사설 IP는 서버 접속 정보라 공개 저장소에 커밋하지 않는다 (CLAUDE.md 3-1 보안)
#   2. 인스턴스를 중지했다 켜면 사설 IP가 바뀔 수 있는데, file_sd 파일은 Prometheus가 알아서 다시 읽는다 —
#      이 파일을 고칠 때와 달리 재시작도, 설정 리로드도 필요 없다
#
# targets/ 파일은 서버에서 만든다 (monitoring/README.md "운영(별도 EC2) 적용" 참고).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # 서비스가 하나뿐이라 지금은 쓸 일이 적지만, 7.3.3에서 Grafana Cloud로 remote_write하면
  # 다른 소스와 섞이므로 어느 환경에서 온 메트릭인지 구분할 라벨이 필요하다
  external_labels:
    env: prod

# 경보 규칙 파일 (7.3.1). 로컬(prometheus.yml)과 같은 파일
rule_files:
  - /etc/prometheus/alert-rules.yml

# 경보가 울리면 보낼 곳 (7.3.2). 같은 Compose 네트워크 안의 alertmanager 서비스
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # 백엔드 Actuator (7.2.1). 메인 EC2의 관리 포트 8081 — 보안 그룹에서 모니터링 EC2의 사설 IP에만 연다
  - job_name: backend
    metrics_path: /actuator/prometheus
    file_sd_configs:
      - files: ["/etc/prometheus/targets/backend.json"]

  # 메인 EC2의 호스트 자원 (인프라 대시보드). 모니터링 호스트 자신이 아니라 서비스가 도는 쪽을 본다
  - job_name: node
    file_sd_configs:
      - files: ["/etc/prometheus/targets/node.json"]

  # Alertmanager 자기 자신 (7.3.1 AlertDeliveryFailing 경보가 alertmanager_notifications_failed_total을 본다)
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
