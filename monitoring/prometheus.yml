# Prometheus 스크레이프 설정 — 로컬 (BE-70 WBS 7.2.2 · node_exporter는 COMMON-43 WBS 7.2.4)
# 운영(별도 EC2)은 prometheus.prod.yml을 쓴다 — 대상 주소가 사설 IP라 파일을 나눴다.
# "scrape 대상 · 간격 · 보존 기간" 중 간격은 여기, 보존 기간은 docker-compose.yml(--storage.tsdb.retention.time)에 있다.
global:
  scrape_interval: 15s      # Actuator 응답은 가벼워서(지금은 메트릭 몇십 개) 15s도 부담 없다. 기본값 1m보다 촘촘해 대시보드 반응이 빠르다
  evaluation_interval: 15s  # 7.3.1 경보 규칙도 이 주기로 평가된다
  # rate() · irate()는 표본이 최소 4~5개는 있어야 값이 튀지 않는다. scrape_interval=15s면 7.3.1 경보의 rate(...[1m])
  # 이상(15s * 4)을 쓴다 — [1m] 미만 창은 쓰지 않는다

# 경보 규칙 파일 (7.3.1). 로컬 · 운영이 같은 파일을 쓴다 — prometheus.prod.yml도 같은 경로를 가리킨다
rule_files:
  - /etc/prometheus/alert-rules.yml

# 경보가 울리면 보낼 곳 (7.3.2). 같은 Compose 네트워크 안의 alertmanager 서비스
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Prometheus 자기 자신. 공식 기본 설정에도 들어 있는 항목으로, 수집 파이프라인 자체가 멈추지 않았는지 확인하는 용도다
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # 백엔드 Actuator (BE-66 · 7.2.1). 애플리케이션 포트(8080)가 아니라 관리 포트(8081)만 스크레이프한다
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]

  # 호스트 자원 — 인프라 대시보드(7.2.4)가 쓴다. job 이름 "node"는 대시보드 쿼리에 박혀 있으니 바꾸지 않는다.
  # 운영에서는 같은 job 이름으로 메인 EC2의 node_exporter를 가리킨다(prometheus.prod.yml)
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
