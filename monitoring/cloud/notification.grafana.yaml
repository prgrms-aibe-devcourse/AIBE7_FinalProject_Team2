# Grafana Cloud 알림 경로 · 음소거 시간 — 운영 스택 설정 기록 (COMMON-64, 10/26)
#
# - 원본은 Grafana Cloud다. 음소거 시간은 화면의 Export(YAML) 결과 그대로이고, 알림 정책은 Editor 권한으로 Export가
#   막혀(403) 같은 형식으로 옮겨 적었다. 화면에서 바꿨으면 이 파일도 같이 고친다.
# - 연락처(Contact point) lawnambul-slack은 Slack Incoming Webhook 주소(비밀값)를 담고 있어 여기 적지 않는다.
#   다시 만들 때는 Contact points → New → Slack → Webhook URL에 직접 넣고, Title · Text Body에
#   slack-template.tmpl의 템플릿 이름을 넣는다(monitoring/README.md "Grafana Cloud 운영 설정").
apiVersion: 1

# 서버는 평일 09:00 ~ 18:00에만 켜져 있다(주말 강제 종료). 꺼져 있는 동안 BackendScrapeTargetMissing이 계속 울리지 않게 막는다.
# 아침은 09:10까지 — 09:00에 서버가 켜지고 backend가 준비되기까지 1분 남짓 걸려, 09:00에 풀면 "발생 → 해결" 알림이 매일 온다.
# 시간대는 반드시 Asia/Seoul — 비워 두면 UTC로 계산돼 9시간 어긋난다.
muteTimes:
    - orgId: 1
      name: 운영시간외
      time_intervals:
        - times:
            - start_time: "00:00"
              end_time: "09:10"
            - start_time: "18:00"
              end_time: "24:00"
          weekdays: ['monday:friday']
          location: Asia/Seoul
        - {weekdays: [saturday, sunday], location: Asia/Seoul}

# 기본 받는 곳을 lawnambul-slack으로 두고(원래 empty — 아무 데도 안 감), lawnambul 폴더 경보에만 음소거를 건다.
# 음소거는 기본(루트) 정책에는 걸 수 없어서 하위 경로로 나눴다.
# repeat_interval 4h: 같은 경보가 계속 울리는 동안 4시간마다 다시 보낸다. 해결 알림은 group_interval(5m) 단위로 묶여
# 복구 뒤 최대 5분 늦게 온다(10/26 시험: 발생 알림 정지 후 약 2분 40초, 해결 알림 복구 후 약 5분).
policies:
    - orgId: 1
      receiver: lawnambul-slack
      group_by:
        - grafana_folder
        - alertname
      routes:
        # 생존 신호(Watchdog): 맨 앞에 둔다 — 먼저 맞는 경로 하나만 타므로, 뒤에 두면 아래 4h 경로로 가서 4시간마다 온다.
        # 항상 발생 상태라 repeat_interval(24h)마다 한 번만 Slack에 나간다. 음소거 시간에 걸리면 다음 운영 시간에 나간다.
        # → 운영일에 하루 넘게 생존 신호가 없으면 경보 경로(규칙 · 연락처 · 정책)가 멈춘 것이다(PR #286 리뷰, 10/26 규칙 0개 사고).
        - receiver: lawnambul-slack
          object_matchers:
            - ['alertname', '=', 'Watchdog']
            - ['grafana_folder', '=', 'lawnambul']
          mute_time_intervals:
            - 운영시간외
          group_by:
            - alertname
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 24h
        - receiver: lawnambul-slack
          object_matchers:
            - ['grafana_folder', '=', 'lawnambul']
          mute_time_intervals:
            - 운영시간외
          group_by:
            - grafana_folder
            - alertname
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
