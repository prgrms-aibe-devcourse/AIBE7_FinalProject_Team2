# Grafana Cloud 경보 규칙 — 운영 스택에 실제로 들어 있는 설정의 내보내기(Export) 사본 (COMMON-64, 10/26)
#
# - 원본은 Grafana Cloud다. 이 파일은 "지금 Cloud에 무엇이 있는지"의 기록이자, 스택을 다시 만들 때 쓰는 재현용 사본이다.
#   화면에서 규칙을 고쳤으면 Alerting → Alert rules → 폴더 lawnambul → Export(YAML)로 다시 받아 이 파일을 바꾼다.
# - 규칙의 뜻 · 임계값 · for 값은 monitoring/alert-rules.yml(로컬 Prometheus)과 같다. 다른 점은 monitoring/README.md
#   "Grafana Cloud 운영 설정" 절의 표에 있다(env="prod" 필터 · 데이터 없음 = 정상 · Watchdog은 하루 한 번 생존 신호 ·
#   AlertDeliveryFailing 제외).
# - 그룹 lawnambul-meta(Watchdog)는 서비스 규칙과 따로 둔다. 항상 발생 상태가 정상이고, 알림 경로에서 24시간마다 한 번만
#   Slack으로 나간다(notification.grafana.yaml). 데이터 없음 · 오류도 "발생"으로 둬, 평가가 이상해도 신호가 끊기지 않게 한다.
# - 조건 C(threshold > -1)는 "A가 값을 하나라도 돌려주면 발생"이라는 뜻이다. A의 PromQL이 이미 비교식(> 0.05 등)이라
#   조건에 맞을 때만 시계열이 나온다. BackendDown(up == 0)은 값이 0이라 > 0으로 두면 울리지 않아 -1로 둔다.
# - 다시 넣는 법: 화면(New alert rule)에서 같은 값으로 만들거나, 폴더 lawnambul을 만든 뒤
#   POST /api/ruler/grafana/api/v1/rules/<폴더 uid>로 그룹을 보낸다(10/26에 쓴 방법, monitoring/README.md).
#   Grafana Cloud는 파일 프로비저닝을 쓸 수 없고, 화면의 Import는 Prometheus 형식용이라 이 파일을 그대로 넣지 않는다.
# - 아래 uid는 이 스택에서 매겨진 값이다. 새 스택이면 새로 매겨지므로 옮겨 적지 않아도 된다.
apiVersion: 1
groups:
    - orgId: 1
      name: lawnambul-meta
      folder: lawnambul
      interval: 1m
      rules:
        - uid: bg2dktc2nugw0f
          title: Watchdog
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                datasource:
                    type: prometheus
                    uid: grafanacloud-prom
                expr: vector(1)
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - -1
                        type: gt
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: Alerting
          execErrState: Alerting
          annotations:
            description: 이 메시지가 운영일에 하루 넘게 오지 않으면 경보 경로가 멈춘 것이다 — Alert rules · Contact points를 확인한다.
            source: monitoring/alert-rules.yml (Watchdog)
            summary: 경보 경로 정상 (하루 한 번)
          labels:
            severity: info
          isPaused: false
    - orgId: 1
      name: lawnambul-service
      folder: lawnambul
      interval: 1m
      rules:
        - uid: cg2d6p3zsvwu8f
          title: HighErrorRate
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                datasource:
                    type: prometheus
                    uid: grafanacloud-prom
                expr: sum(rate(http_server_requests_seconds_count{outcome="SERVER_ERROR",env="prod"}[5m])) / sum(rate(http_server_requests_seconds_count{env="prod"}[5m])) > 0.05 and sum(rate(http_server_requests_seconds_count{env="prod"}[5m])) > 0.1
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - -1
                        type: gt
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 5m
          annotations:
            description: 지난 5분 동안 전체 요청 중 5xx 응답 비율이 {{ humanizePercentage $values.A.Value }}입니다.
            source: monitoring/alert-rules.yml
            summary: 5xx 응답 비율이 5%를 넘었습니다
          labels:
            severity: critical
          isPaused: false
        - uid: ag2d6p3zvdt6ob
          title: HighLatencyP95
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                datasource:
                    type: prometheus
                    uid: grafanacloud-prom
                expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{uri!~"/api/v1/admin/.*",env="prod"}[5m])) by (le)) > 2
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - -1
                        type: gt
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 5m
          annotations:
            description: 지난 5분 p95 응답 시간이 {{ humanizeDuration $values.A.Value }}입니다(관리자 경로 제외).
            source: monitoring/alert-rules.yml
            summary: 응답 시간 p95가 2초를 넘었습니다
          labels:
            severity: warning
          isPaused: false
        - uid: eg2d6p3zxvpj4e
          title: DbConnectionPoolNearExhaustion
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                datasource:
                    type: prometheus
                    uid: grafanacloud-prom
                expr: hikaricp_connections_active{env="prod"} / hikaricp_connections_max{env="prod"} > 0.9
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - -1
                        type: gt
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 3m
          annotations:
            description: HikariCP 사용률이 {{ humanizePercentage $values.A.Value }}입니다(90% 초과 3분 지속).
            source: monitoring/alert-rules.yml
            summary: DB 커넥션 풀이 거의 찼습니다
          labels:
            severity: critical
          isPaused: false
        - uid: bg2d6p400dlvkc
          title: DbConnectionPending
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                datasource:
                    type: prometheus
                    uid: grafanacloud-prom
                expr: hikaricp_connections_pending{env="prod"} > 0
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - -1
                        type: gt
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 2m
          annotations:
            description: 커넥션을 기다리는 스레드가 {{ $values.A.Value }}개입니다(2분 이상 지속).
            source: monitoring/alert-rules.yml
            summary: DB 커넥션을 기다리는 요청이 있습니다
          labels:
            severity: warning
          isPaused: false
        - uid: fg2d6p402vi80b
          title: HighAiCallFailureRate
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                datasource:
                    type: prometheus
                    uid: grafanacloud-prom
                expr: sum(rate(lawnambul_ai_call_total{result="failure",env="prod"}[10m])) / sum(rate(lawnambul_ai_call_total{env="prod"}[10m])) > 0.3 and sum(rate(lawnambul_ai_call_total{env="prod"}[10m])) > 0.05
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - -1
                        type: gt
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 5m
          annotations:
            description: 지난 10분 AI 호출 실패율이 {{ humanizePercentage $values.A.Value }}입니다.
            source: monitoring/alert-rules.yml
            summary: AI 호출 실패율이 30%를 넘었습니다
          labels:
            severity: warning
          isPaused: false
        - uid: dg2d6p405dekgf
          title: CaseImportStuck
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                datasource:
                    type: prometheus
                    uid: grafanacloud-prom
                expr: lawnambul_case_import_oldest_running_seconds{env="prod"} > 600
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - -1
                        type: gt
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 2m
          annotations:
            description: 진행 중인 사건 등록 작업이 {{ humanizeDuration $values.A.Value }}째 끝나지 않았습니다. 서버 재시작으로 멈춘 작업이면 COMMON-51 대상인지 확인하세요.
            source: monitoring/alert-rules.yml
            summary: 사건 등록 작업이 오래 멈춰 있습니다
          labels:
            severity: warning
          isPaused: false
        - uid: fg2d6p40ad79cd
          title: BackendDown
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                datasource:
                    type: prometheus
                    uid: grafanacloud-prom
                expr: up{job="backend",env="prod"} == 0
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - -1
                        type: gt
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 1m
          annotations:
            description: backend 타깃이 1분 넘게 스크레이프에 응답하지 않습니다.
            source: monitoring/alert-rules.yml
            summary: 백엔드가 응답하지 않습니다
          labels:
            severity: critical
          isPaused: false
        - uid: fg2d6p40cv3lsa
          title: BackendScrapeTargetMissing
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                datasource:
                    type: prometheus
                    uid: grafanacloud-prom
                expr: absent(up{job="backend",env="prod"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - -1
                        type: gt
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 1m
          annotations:
            description: backend 지표(up)가 1분 넘게 Grafana Cloud에 들어오지 않습니다. 서버 전체 정지 · Alloy 중단 · 설정 오류를 확인하세요.
            source: monitoring/alert-rules.yml
            summary: 백엔드 지표가 끊겼습니다 (서버 · Alloy 정지 가능)
          labels:
            severity: critical
          isPaused: false
