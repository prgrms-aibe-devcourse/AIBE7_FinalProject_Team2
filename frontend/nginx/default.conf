# 운영 Nginx 설정 (BE-58, WBS 7.1.1)
# 프론트 정적 파일(Vite 빌드 결과)을 직접 내려주고, /api 요청만 백엔드(Spring Boot)로 넘긴다.
# 프론트와 API를 같은 도메인으로 두는 이유: 익명 ID 쿠키(NLNB_AID, SameSite=Lax)가 그대로 전달된다 (docs/tech-stack.md 8장)
#
# 바꿀 때 주의
# - /api는 절대 index.html로 떨어지면 안 된다. 떨어지면 API가 200 + HTML을 돌려주고,
#   프론트는 "서버 응답을 해석할 수 없어요"(INTERNAL_ERROR)를 띄운다 (FE-2 리뷰 · api/client.js)
# - Rate limit(7.4.6) · HTTPS(도메인 확보 후)는 이 파일에 추가한다

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nginx 버전을 응답 헤더 · 오류 페이지에 노출하지 않는다
    server_tokens off;

    # 요청 본문 상한. 판결 제출 등 JSON 요청만 있어 1MB면 충분하다
    client_max_body_size 1m;

    # ---------- 백엔드 주소: 요청 때마다 다시 조회 ----------
    # proxy_pass에 호스트 이름을 직접 쓰면 Nginx가 시작할 때 한 번만 IP를 조회한다.
    # 그러면 백엔드만 새 이미지로 바꿔 컨테이너 IP가 달라졌을 때(7.1.3 CD) 웹은 열려도 API가 옛 IP로 가서 실패한다.
    # Docker 내부 DNS(127.0.0.11)로 10초마다 다시 조회하고, 주소를 변수로 넘겨 매 요청에 적용한다 (CodeRabbit 리뷰 반영)
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    # 경로 없이 주소만 둔다 → 원래 요청 경로 · 쿼리(/api/v1/cases?crimeType=...)가 그대로 넘어간다
    set $backend_upstream http://backend:8080;

    # ---------- API: 백엔드로 전달 ----------
    # ^~ : 이 접두사가 맞으면 아래의 정규식 location을 더 보지 않는다 (정적 파일 규칙에 가로채이지 않게)
    location ^~ /api/ {
        proxy_pass $backend_upstream;

        # 백엔드가 원래 요청 정보를 알 수 있게 넘긴다 (로그 · 쿠키 Secure 판단 · 추후 Rate limit)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 슬래시 없는 /api도 백엔드로 보낸다 (SPA fallback으로 index.html이 나가지 않게)
    location = /api {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 빌드 산출물: 오래 캐시 ----------
    # Vite가 파일 이름에 내용 해시를 붙이므로(예: index-a1b2c3.js) 내용이 바뀌면 이름도 바뀐다
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 화면 주소: SPA fallback ----------
    # /cases/1/review 같은 화면 주소는 실제 파일이 없으므로 index.html을 내려주고, 라우터(app/router.js)가 화면을 고른다.
    # index.html은 캐시하지 않는다 — 새 배포 직후에도 새 assets 파일 이름을 받아야 한다
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
