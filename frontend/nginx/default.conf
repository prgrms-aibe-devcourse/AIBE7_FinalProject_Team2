# 운영 Nginx 설정 (BE-58, WBS 7.1.1)
# 프론트 정적 파일(Vite 빌드 결과)을 직접 내려주고, /api 요청만 백엔드(Spring Boot)로 넘긴다.
# 프론트와 API를 같은 도메인으로 두는 이유: 익명 ID 쿠키(NLNB_AID, SameSite=Lax)가 그대로 전달된다 (docs/tech-stack.md 8장)
#
# 파일 구성 (BE-75에서 나눔)
# - 이 파일: http 블록 설정(Rate limit zone) + 기본 http server(80)
# - snippets/app.conf: /api 프록시 · SPA fallback 등 앱 location. 80 · 443 server가 함께 include한다
# - snippets/api-proxy.conf: /api 두 location의 공통 본문(Rate limit 적용 limit_req · burst · 프록시 · 헤더)
# - snippets/acme-challenge.conf: Let's Encrypt 도메인 확인 경로 (80 server만)
# - https.conf.template + 40-enable-https.sh: 서버에 인증서가 있을 때만 컨테이너 시작 시 https server를 만든다
#   (CI · 로컬 · 인증서 발급 전 서버는 지금처럼 http만 뜬다, docs/decisions/BE-75.md)
#
# 바꿀 때 주의
# - /api는 절대 index.html로 떨어지면 안 된다. 떨어지면 API가 200 + HTML을 돌려주고,
#   프론트는 "서버 응답을 해석할 수 없어요"(INTERNAL_ERROR)를 띄운다 (FE-2 리뷰 · api/client.js)
# - 앱 location은 snippets/app.conf에서만 고친다. 그래야 http · https에 똑같이 적용된다

# ---------- Rate limit: 1차 (BE-63, WBS 7.4.6) ----------
# 한 IP가 /api를 짧은 시간에 너무 많이 부르면 백엔드 앞에서 막는다(t3.small 한 대 보호). 화면 · 정적 파일은 제한하지 않는다.
# - 기준은 IP: 로그인 전 서비스라 사용자를 구분할 다른 값이 없다. Nginx가 맨 앞이라 $binary_remote_addr가 사용자 IP여야 한다
#   — 배포 서버에서 실제로 그런지 확인한다(모두 172.x로 보이면 전체가 한 IP로 묶인다). 앞에 로드 밸런서 · CDN을 두면
#   그 IP로 묶이므로 real_ip 설정을 함께 바꾼다 (deploy/README.md "Rate limit")
# - 값: 평균 초당 20번, 순간 40번까지는 기다리지 않고 처리. 혼자 쓰면 초당 1 ~ 3번이고(동시 호출 · 폴링 없음),
#   발표장처럼 여러 명이 같은 와이파이(같은 IP)를 써도 막히지 않게 넉넉히 둔다. 실제로 막히는 게 보이면 조정한다
# - 2차: 로그인 · 토큰 재발급 엔드포인트는 아래 전용 zone을 /api 공통 제한에 더해 건다 (BE-62 카카오 시작 · BE-63 재발급 · 관리자 로그인)
# - zone은 http · https server가 같이 쓴다 → 한 IP의 http · https 요청을 합쳐서 센다
# zone 메모리 10MB ≈ IP 약 16만 개 (이 파일은 nginx.conf의 http 블록 안에서 읽히므로 여기에 둘 수 있다)
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;

# 카카오 로그인 시작 · 콜백 전용 제한 (BE-62, PR #229 리뷰 — BE-63 2차 중 로그인 경로 부분)
# - 시작 요청마다 백엔드가 Redis에 인가 요청(state)을 5분 보관한다. /api 공통 제한은 IP별이라 여러 IP로 나누면
#   Redis(200MB, noeviction)를 채울 수 있다 → IP별 제한에 더해 "전체 합계" 제한을 둔다
# - 전체: 초당 10번 · 순간 50번 → 대기 중 state는 많아야 약 3,000개(10/s × 300s, 개당 약 1KB → 약 3MB)
# - IP별: 분당 30번 · 순간 30번. 로그인 1번 = 시작 + 콜백 2번이라, 발표장처럼 같은 와이파이(같은 IP)에서
#   여러 명이 동시에 로그인해도 막히지 않게 둔다. 실제로 막히는 게 보이면 조정한다
# - 전체 zone의 키는 항상 같은 값이라(map) 모든 요청이 한 칸에서 센다
map $host $oauth_all_key {
    default oauth;
}
limit_req_zone $binary_remote_addr zone=oauth_per_ip:10m rate=30r/m;
limit_req_zone $oauth_all_key zone=oauth_all:1m rate=10r/s;
# 전용 제한(아래 두 zone)은 POST만 센다 (PR #236 CodeRabbit 리뷰)
# - 재발급 · 로그아웃 · 관리자 로그인은 POST 전용 API다. 키가 IP 그대로면 같은 경로의 GET도 한도를 써서,
#   같은 IP(같은 와이파이)의 누군가가 GET을 반복하면 정상 로그인 POST가 429를 받는다
# - 키가 빈 값이면 Nginx가 세지 않는다 → POST가 아니면 빈 키. 그런 요청도 /api 공통 제한(api_per_ip)은 그대로 받는다
map $request_method $post_only_ip {
    POST    $binary_remote_addr;
    default "";
}

# 토큰 재발급 · 로그아웃 전용 제한 (BE-63 2차, WBS 7.4.6)
# - 정상 화면은 재발급을 액세스 토큰 만료(15분) · 새로고침 때만 부르고, 동시 재발급은 프론트(api/client.js)가 하나로 묶는다
#   → /api 공통(초당 20번)보다 훨씬 낮게 둔다. 리프레시 토큰을 마구 넣어 보는 시도 · Redis 조회 폭주를 늦춘다
# - IP별: 분당 30번 · 순간 30번. 발표장처럼 같은 와이파이(같은 IP)에서 여러 명이 동시에 새로고침해도 막히지 않게
#   카카오 로그인 시작(oauth_per_ip)과 같은 값으로 둔다. 실제로 막히는 게 보이면 조정한다
# - 전체 합계 zone은 두지 않는다: 재발급은 기존 토큰을 지우고(getAndDelete) 새 토큰 하나를 쓰므로 Redis 키가 늘지 않고,
#   쿠키가 없거나 모르는 토큰은 401로 끝나 아무것도 쓰지 않는다(RefreshTokenStore). 카카오 시작(state를 새로 씀)과 다르다
# - 429여도 프론트는 로그인 표시를 지우지 않는다(재발급이 401일 때만 지움) → 다음 요청 때 다시 재발급한다
limit_req_zone $post_only_ip zone=auth_token_per_ip:10m rate=30r/m;

# 관리자 로그인 전용 제한 (BE-63 2차)
# - 백엔드에 로그인 실패 횟수 잠금이 없어 비밀번호 대입을 여기서 늦춘다. 요청마다 Argon2id 해시 검증(BE-90)이 CPU를 쓰는 것도 막는다
# - IP별: 분당 5번 · 순간 5번 → 처음 5번은 바로 처리하고 그 뒤는 12초에 1번(한 시간 약 300번). 관리자는 몇 명뿐이라 정상 사용에는 닿지 않는다
# - CSRF 토큰 조회 · 내 정보 · 로그아웃(/api/v1/admin/auth/csrf · me · logout)은 /api 공통 제한만 받는다
# - zone 메모리 1MB ≈ IP 약 1만 6천 개. 관리자 로그인은 여는 IP가 적어 충분하다(PR #236 리뷰 — 공유 메모리 합계를 줄인다).
#   가득 차면 가장 오래 안 쓴 IP부터 지우고, 그래도 자리가 없으면 그 요청은 429다
limit_req_zone $post_only_ip zone=admin_login_per_ip:1m rate=5r/m;

# 아이디 회원가입 · 로그인 전용 제한 (BE-113, M-5 · M-6, docs/decisions/BE-113.md 결정 6)
# - 백엔드에 계정별 로그인 실패 잠금이 없어(결정 6) 비밀번호 대입을 여기서 늦춘다. 가입은 중복 아이디(409 DUPLICATE_ID)로
#   아이디가 있는지 드러나므로 대량 조회를 늦춘다
# - 관리자 로그인 zone과 나눈다 → 같은 와이파이의 회원 로그인이 관리자 로그인 한도(분당 5번)를 쓰지 않는다
# - IP별: 로그인 분당 20번 · 순간 20번, 가입 분당 10번 · 순간 10번. 관리자보다 넉넉한 이유는 발표장처럼 같은 와이파이(같은 IP)에서
#   여러 명이 동시에 로그인 · 가입하기 때문이다. 실제로 막히는 게 보이면 조정한다
# - 전체 합계(두 경로 합): 초당 10번, 넘는 요청은 순간 20번까지 "기다렸다가" 보낸다(app.conf에서 nodelay 없이 건다).
#   요청마다 Argon2 해시(m=19MiB, BE-90) 하나가 메모리를 쓴다. 여러 IP로 나눠 IP별 제한을 피해도 백엔드에 동시에 도착하는 수가
#   묶여 t3.small 메모리를 다 쓰지 않게 한다(BE-62 oauth_all과 같은 이유). 키는 POST일 때만 고정값이다
limit_req_zone $post_only_ip zone=member_login_per_ip:10m rate=20r/m;
limit_req_zone $post_only_ip zone=member_signup_per_ip:10m rate=10r/m;
map $request_method $member_auth_all_key {
    POST    member_auth;
    default "";
}
limit_req_zone $member_auth_all_key zone=member_auth_all:1m rate=10r/s;

limit_req_status 429;
limit_req_log_level warn;

# ---------- 429 전용 로그 (BE-63, Loki 수집) ----------
# 429는 백엔드까지 가지 않아 백엔드 지표 · 로그에 남지 않는다. 막힌 요청만 JSON 한 줄씩 따로 남겨
# 모니터링 에이전트(deploy/docker-compose.monitoring-agent.yml)의 Alloy가 Loki로 보내게 한다.
# - 평소 접속 기록(stdout)은 그대로 두고, 이 파일에는 status 429만 쓴다(if=$rate_limited)
# - 파일 크기는 41-trim-rate-limit-log.sh가 상한을 건다 — 공격 중에도 디스크를 채우지 않게
# - route: 막힌 요청의 경로를 고정된 몇 개 값으로 묶는다(Loki 라벨로 쓴다 → 값 종류가 적어야 한다).
#   Nginx는 "어느 zone이 막았는지"를 변수로 주지 않아 경로로 나눈다. 그래서 zone과 1:1이 아니다 —
#   예: route=auth_token은 재발급 · 로그아웃 경로에서 난 429로, 전용 zone(auth_token_per_ip) 또는 /api 공통(api_per_ip) 어느 쪽에
#   걸렸어도 같다. 어느 zone인지는 오류 로그(docker compose logs web)의 'by zone "..."'으로 본다
# - 경로는 $uri(쿼리 제외)만 남긴다. IP는 막힌 쪽을 찾기 위해 남기되 라벨이 아니라 본문 필드다
map $status $rate_limited {
    429     1;
    default 0;
}
# 429 응답의 Retry-After(초). 경로의 전용 제한이 다음 1번을 허용하기까지의 간격에 맞춘다(rate의 역수, 올림).
# 같은 경로라도 /api 공통 제한(1초)에 걸렸을 수 있어, 그때는 실제보다 조금 길게 안내된다 — 짧게 안내해 바로 다시 막히는 것보다 낫다
# - auth_token_per_ip · oauth_per_ip 분당 30번 → 2초, admin_login_per_ip 분당 5번 → 12초, 그 밖 api_per_ip 초당 20번 → 1초
# - member_login_per_ip 분당 20번 → 3초, member_signup_per_ip 분당 10번 → 6초 (BE-113)
# - zone의 rate를 바꾸면 여기도 같이 바꾼다. 프론트는 429를 자동으로 다시 보내지 않는다(안내용)
map $uri $rate_limit_retry_after {
    /api/v1/auth/token/reissue               2;
    /api/v1/auth/logout                      2;
    /api/v1/admin/auth/login                 12;
    /api/v1/auth/login                       3;
    /api/v1/auth/signup                      6;
    ~^/api/v1/auth/oauth2/authorization/     2;
    default                                  1;
}
map $uri $rate_limit_route {
    /api/v1/auth/token/reissue               auth_token;
    /api/v1/auth/logout                      auth_token;
    /api/v1/admin/auth/login                 admin_login;
    /api/v1/auth/login                       member_auth;
    /api/v1/auth/signup                      member_auth;
    ~^/api/v1/auth/oauth2/authorization/     oauth;
    default                                  api;
}
log_format rate_limited escape=json
    '{"time":"$time_iso8601","status":$status,"route":"$rate_limit_route",'
    '"method":"$request_method","path":"$uri","ip":"$remote_addr"}';
access_log /var/log/nginx-ratelimit/rate-limited.log rate_limited if=$rate_limited;

# ---------- HSTS (COMMON-67, BE-75 후속) ----------
# https 응답에만 Strict-Transport-Security를 붙인다. http 응답에서는 값이 비어 Nginx가 헤더를 보내지 않는다
# (localhost · 탄력적 IP의 http 스모크 테스트, 인증서 발급 전 서버) — 브라우저도 http로 받은 HSTS는 무시한다.
# - 화면 · 정적 파일(snippets/security-headers.conf)과 /api(snippets/api-proxy.conf)가 이 값 하나를 쓴다.
#   백엔드(Spring Security)는 HSTS를 끈다(SecurityConfig.responseHeaders) → 기간을 바꿀 때 여기 한 곳만 고친다
# - 1일(86400초)부터 시작한다: 켠 뒤 인증서가 깨지면 사용자가 max-age 동안 접속하지 못한다(BE-75).
#   첫 인증서 자동 갱신이 문제없이 돈 것을 확인한 뒤(certbot renew 로그 · 새 만료일) 1주 → 1년으로 늘린다 (docs/decisions/COMMON-67.md)
# - includeSubDomains · preload는 아직 붙이지 않는다(www는 루트로 이동만 하고, 1년으로 늘릴 때 함께 판단한다)
map $scheme $hsts_header {
    https   "max-age=86400";
    default "";
}

# ---------- 기본 http server ----------
# 도메인 server(https 활성화 시)에 맞지 않는 모든 요청을 받는다: localhost · 탄력적 IP · 인증서 발급 전 도메인.
# 여기서는 https로 이동시키지 않는다 — deploy.sh · CI의 스모크 테스트가 http://localhost로 확인하기 때문이다
# (이동시키면 스모크 테스트가 301을 받아 실패하고, 자동 배포가 되돌려진다). 도메인 http → https 이동은 https.conf.template에 있다
server {
    listen 80 default_server;
    server_name _;

    include /etc/nginx/snippets/acme-challenge.conf;
    include /etc/nginx/snippets/app.conf;
}
