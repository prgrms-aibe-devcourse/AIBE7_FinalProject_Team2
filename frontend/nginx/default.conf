# 운영 Nginx 설정 (BE-58, WBS 7.1.1)
# 프론트 정적 파일(Vite 빌드 결과)을 직접 내려주고, /api 요청만 백엔드(Spring Boot)로 넘긴다.
# 프론트와 API를 같은 도메인으로 두는 이유: 익명 ID 쿠키(NLNB_AID, SameSite=Lax)가 그대로 전달된다 (docs/tech-stack.md 8장)
#
# 바꿀 때 주의
# - /api는 절대 index.html로 떨어지면 안 된다. 떨어지면 API가 200 + HTML을 돌려주고,
#   프론트는 "서버 응답을 해석할 수 없어요"(INTERNAL_ERROR)를 띄운다 (FE-2 리뷰 · api/client.js)
# - Rate limit 1차(7.4.6, BE-63)는 아래에 있다. HTTPS(도메인 확보 후)를 추가할 때 443 server 블록의 /api에도
#   같은 limit_req · error_page 429를 넣는다 (빠뜨리면 https로는 제한이 걸리지 않는다, deploy/README.md "Rate limit")

# ---------- Rate limit: 1차 (BE-63, WBS 7.4.6) ----------
# 한 IP가 /api를 짧은 시간에 너무 많이 부르면 백엔드 앞에서 막는다(t3.small 한 대 보호). 화면 · 정적 파일은 제한하지 않는다.
# - 기준은 IP: 로그인 전 서비스라 사용자를 구분할 다른 값이 없다. Nginx가 맨 앞이라 $binary_remote_addr가 사용자 IP여야 한다
#   — 배포 서버에서 실제로 그런지 확인한다(모두 172.x로 보이면 전체가 한 IP로 묶인다). 앞에 로드 밸런서 · CDN을 두면
#   그 IP로 묶이므로 real_ip 설정을 함께 바꾼다 (deploy/README.md "Rate limit")
# - 값: 평균 초당 20번, 순간 40번까지는 기다리지 않고 처리. 혼자 쓰면 초당 1 ~ 3번이고(동시 호출 · 폴링 없음),
#   발표장처럼 여러 명이 같은 와이파이(같은 IP)를 써도 막히지 않게 넉넉히 둔다. 실제로 막히는 게 보이면 조정한다
# - 2차(10/23): 로그인 · 토큰 재발급 엔드포인트에 더 엄격한 zone을 따로 둔다 (7.4.2 이후)
# zone 메모리 10MB ≈ IP 약 16만 개 (이 파일은 nginx.conf의 http 블록 안에서 읽히므로 여기에 둘 수 있다)
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_req_status 429;
limit_req_log_level warn;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nginx 버전을 응답 헤더 · 오류 페이지에 노출하지 않는다
    server_tokens off;

    # 요청 본문 상한. 판결 제출 등 JSON 요청만 있어 1MB면 충분하다
    client_max_body_size 1m;

    # ---------- 백엔드 주소: 요청 때마다 다시 조회 ----------
    # proxy_pass에 호스트 이름을 직접 쓰면 Nginx가 시작할 때 한 번만 IP를 조회한다.
    # 그러면 백엔드만 새 이미지로 바꿔 컨테이너 IP가 달라졌을 때(7.1.3 CD) 웹은 열려도 API가 옛 IP로 가서 실패한다.
    # Docker 내부 DNS(127.0.0.11)로 10초마다 다시 조회하고, 주소를 변수로 넘겨 매 요청에 적용한다 (CodeRabbit 리뷰 반영)
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    # 경로 없이 주소만 둔다 → 원래 요청 경로 · 쿼리(/api/v1/cases?crimeType=...)가 그대로 넘어간다
    set $backend_upstream http://backend:8080;

    # ---------- API: 백엔드로 전달 ----------
    # ^~ : 이 접두사가 맞으면 아래의 정규식 location을 더 보지 않는다 (정적 파일 규칙에 가로채이지 않게)
    location ^~ /api/ {
        # Rate limit (BE-63): 넘으면 아래 @api_rate_limited가 API 명세 1-4 형식의 JSON 429를 돌려준다
        limit_req zone=api_per_ip burst=40 nodelay;
        error_page 429 = @api_rate_limited;

        proxy_pass $backend_upstream;

        # 백엔드가 원래 요청 정보를 알 수 있게 넘긴다 (로그 · 쿠키 Secure 판단 · 감사 로그 IP — 백엔드가 이 값을 쓰려면
        # forward-headers-strategy=native가 필요하다, deploy/README.md "Rate limit"). Rate limit 자체는 이 헤더가 아니라 Nginx가 본 IP를 쓴다
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 슬래시 없는 /api도 백엔드로 보낸다 (SPA fallback으로 index.html이 나가지 않게)
    location = /api {
        limit_req zone=api_per_ip burst=40 nodelay;
        error_page 429 = @api_rate_limited;

        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rate limit에 걸린 /api 요청의 응답 (BE-63). Nginx 기본 429는 HTML이라 프론트(api/client.js)가
    # 해석하지 못하고 "서버 오류"로 보여 준다 → 서버 에러 형식(API 명세 1-4)과 같은 JSON으로 돌려준다
    location @api_rate_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        add_header Cache-Control "no-store" always;
        # 백엔드 응답에는 Spring Security가 붙이는 헤더라, Nginx가 직접 만드는 이 응답에도 맞춰 붙인다 (리뷰 반영)
        add_header X-Content-Type-Options "nosniff" always;
        return 429 '{"code":"TOO_MANY_REQUESTS","message":"요청이 너무 많습니다. 잠시 후 다시 시도해 주세요.","currentStatus":null,"details":null}';
    }

    # ---------- 빌드 산출물: 오래 캐시 ----------
    # Vite가 파일 이름에 내용 해시를 붙이므로(예: index-a1b2c3.js) 내용이 바뀌면 이름도 바뀐다
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 화면 주소: SPA fallback ----------
    # /cases/1/review 같은 화면 주소는 실제 파일이 없으므로 index.html을 내려주고, 라우터(app/router.js)가 화면을 고른다.
    # index.html은 캐시하지 않는다 — 새 배포 직후에도 새 assets 파일 이름을 받아야 한다
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
