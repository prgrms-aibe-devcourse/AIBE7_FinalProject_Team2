# Let's Encrypt 도메인 소유 확인 경로 (BE-75)
# 서버의 certbot(webroot 방식)이 /var/www/certbot/.well-known/acme-challenge/에 확인 파일을 쓰면,
# Let's Encrypt가 http://<도메인>/.well-known/acme-challenge/<파일>로 받아 간다. 발급 · 90일 갱신 때마다 쓰인다.
# - 반드시 http(80)로 열려 있어야 한다: https로 옮기기 전에 확인하고, 갱신 때도 http로 온다
# - 80번 server 블록 두 곳(default.conf 기본 server, https 활성화 시 도메인 server)에서 include한다
# - 폴더가 비어 있거나(CI · 로컬) 파일이 없으면 404. SPA fallback(index.html)으로 떨어지면 안 된다
#   (index.html이 나가면 Let's Encrypt가 확인 실패로 본다) → smoke-test.sh가 404인지 확인한다
location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
}
