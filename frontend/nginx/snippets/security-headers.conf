# Nginx가 직접 내려주는 응답(화면 · 정적 파일 · 배포 버전 · 429)의 보안 헤더 (COMMON-67, BE-75 후속)
# /api 응답은 백엔드(Spring Security)가 같은 헤더를 붙이므로 여기서 다시 붙이지 않는다(중복 헤더 방지) —
# 그래서 server 블록이 아니라 Nginx가 직접 응답하는 location 안에서만 include한다.
# - 왜 location마다 include하나: Nginx 1.28은 location에 add_header가 하나라도 있으면 server의 add_header를 물려받지 않는다.
#   화면(/) · /assets/ · /version.json은 Cache-Control을 붙이므로 server에 두면 이 헤더들이 빠진다
# - always: 404 · 429처럼 2xx가 아닌 응답에도 붙인다
# - 값은 백엔드(SecurityConfig)와 같게 둔다: nosniff · DENY · strict-origin-when-cross-origin
# - HSTS는 https 응답에만 붙는다($hsts_header, default.conf). 값 · 늘리는 시점은 default.conf 주석과 docs/decisions/COMMON-67.md

# 응답 Content-Type을 브라우저가 추측하지 않게 한다 (HTML이 아닌 파일을 HTML로 실행하는 것 방지)
add_header X-Content-Type-Options "nosniff" always;
# 다른 사이트가 우리 화면을 iframe으로 넣지 못하게 한다 (클릭재킹 방지). 화면 안에서 iframe을 쓰는 곳은 없다
add_header X-Frame-Options "DENY" always;
# 다른 사이트로 나갈 때 전체 주소(경로 · 쿼리) 대신 출처만 보낸다
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# https 응답에만: 이 기간 동안 브라우저가 이 도메인을 https로만 연다 (http에서는 $hsts_header가 비어 보내지 않는다)
add_header Strict-Transport-Security $hsts_header always;
