# 앱 공통 설정 (BE-75에서 default.conf의 server 블록 본문을 그대로 옮겼다)
# http(80) server와 https(443) server가 이 파일 하나를 include한다.
# - 이유: 두 server에 같은 location을 복사해 두면 한쪽만 고치는 실수가 생긴다. 특히 /api의 Rate limit(limit_req ·
#   error_page 429)을 443에 빠뜨리면 https로는 제한이 걸리지 않는다 (BE-63, deploy/README.md "Rate limit")
# - 위치: 이미지 안 /etc/nginx/snippets/app.conf. conf.d 밖에 두어 nginx.conf가 따로 읽지 않게 한다(server 밖에서 읽히면 오류)
# - limit_req_zone 같은 http 블록 설정은 server 안에 둘 수 없어서 default.conf에 남긴다

root /usr/share/nginx/html;
index index.html;

# Nginx 버전을 응답 헤더 · 오류 페이지에 노출하지 않는다
server_tokens off;

# 요청 본문 상한. 판결 제출 등 JSON 요청만 있어 1MB면 충분하다
client_max_body_size 1m;

# ---------- 백엔드 주소: 요청 때마다 다시 조회 ----------
# proxy_pass에 호스트 이름을 직접 쓰면 Nginx가 시작할 때 한 번만 IP를 조회한다.
# 그러면 백엔드만 새 이미지로 바꿔 컨테이너 IP가 달라졌을 때(7.1.3 CD) 웹은 열려도 API가 옛 IP로 가서 실패한다.
# Docker 내부 DNS(127.0.0.11)로 10초마다 다시 조회하고, 주소를 변수로 넘겨 매 요청에 적용한다 (CodeRabbit 리뷰 반영)
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;
# 경로 없이 주소만 둔다 → 원래 요청 경로 · 쿼리(/api/v1/cases?crimeType=...)가 그대로 넘어간다
set $backend_upstream http://backend:8080;

# ---------- API: 백엔드로 전달 ----------
# 두 location의 본문(Rate limit · 프록시 · 헤더 · 타임아웃)은 snippets/api-proxy.conf 하나를 함께 쓴다 (PR #181 리뷰)
# ^~ : 이 접두사가 맞으면 아래의 정규식 location을 더 보지 않는다 (정적 파일 규칙에 가로채이지 않게)
location ^~ /api/ {
    include /etc/nginx/snippets/api-proxy.conf;
}

# 슬래시 없는 /api도 백엔드로 보낸다 (SPA fallback으로 index.html이 나가지 않게)
location = /api {
    include /etc/nginx/snippets/api-proxy.conf;
}

# Rate limit에 걸린 /api 요청의 응답 (BE-63). Nginx 기본 429는 HTML이라 프론트(api/client.js)가
# 해석하지 못하고 "서버 오류"로 보여 준다 → 서버 에러 형식(API 명세 1-4)과 같은 JSON으로 돌려준다
location @api_rate_limited {
    default_type application/json;
    add_header Retry-After 1 always;
    add_header Cache-Control "no-store" always;
    # 백엔드 응답에는 Spring Security가 붙이는 헤더라, Nginx가 직접 만드는 이 응답에도 맞춰 붙인다 (리뷰 반영)
    add_header X-Content-Type-Options "nosniff" always;
    return 429 '{"code":"TOO_MANY_REQUESTS","message":"요청이 너무 많습니다. 잠시 후 다시 시도해 주세요.","currentStatus":null,"details":null}';
}

# ---------- 배포 버전 (BE-60) ----------
# 지금 떠 있는 이미지의 커밋 해시. Actions가 배포 확인에 쓰므로 어디에도 캐시되면 안 된다.
# 파일이 없으면(로컬 빌드 등) SPA fallback으로 index.html이 나가지 않고 404가 나야 한다
location = /version.json {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
}

# ---------- 빌드 산출물: 오래 캐시 ----------
# Vite가 파일 이름에 내용 해시를 붙이므로(예: index-a1b2c3.js) 내용이 바뀌면 이름도 바뀐다
location ^~ /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# ---------- 화면 주소: SPA fallback ----------
# /cases/1/review 같은 화면 주소는 실제 파일이 없으므로 index.html을 내려주고, 라우터(app/router.js)가 화면을 고른다.
# index.html은 캐시하지 않는다 — 새 배포 직후에도 새 assets 파일 이름을 받아야 한다
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
}
