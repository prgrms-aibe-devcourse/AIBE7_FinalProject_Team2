# /api 백엔드 전달 공통 설정 (BE-75 리뷰 반영: app.conf의 두 /api location 중복 제거)
# app.conf의 `location ^~ /api/`와 `location = /api`가 이 파일 하나를 include한다.
# - 이유: 두 location에 같은 줄을 복사해 두면 한쪽만 고치는 실수가 생긴다. app.conf는 http · https server가 함께
#   include하므로, 놓치면 두 프로토콜 모두에 영향을 준다 (PR #181 리뷰)
# - location을 정규식 하나(예: ~ ^/api)로 합치지 않은 이유: 정규식 location은 매칭 우선순위가 달라져
#   ^~ 접두사로 막아 둔 "다른 규칙에 가로채이지 않게"가 깨질 수 있고, 패턴을 잘못 쓰면 /api/v1/...가 SPA로 샌다.
#   매칭 규칙은 그대로 두고 본문만 공유한다
# - location 안에서만 include한다 (limit_req · proxy_pass 등은 location 단위 설정)

# Rate limit (BE-63): 넘으면 app.conf의 @api_rate_limited가 API 명세 1-4 형식의 JSON 429를 돌려준다
limit_req zone=api_per_ip burst=40 nodelay;
error_page 429 = @api_rate_limited;

# HSTS (COMMON-67): Nginx가 화면과 같은 값을 붙인다(default.conf $hsts_header, http에서는 비어 보내지 않음).
# 백엔드도 HSTS를 끄지만(SecurityHeaders), 백엔드 응답의 HSTS는 여기서 한 번 더 지운다 — 웹 · 백엔드 이미지가 따로 배포 · 되돌림되는
# 동안 옛 백엔드(1년)와 새 Nginx(1일) 헤더가 함께 나가면 브라우저는 처음 것만 쓴다(RFC 6797 8.1). 값은 늘 이 한 줄이 정한다
proxy_hide_header Strict-Transport-Security;
add_header Strict-Transport-Security $hsts_header always;
# 다른 보안 헤더(nosniff · DENY · Referrer-Policy)는 백엔드가 붙이므로 여기서 다시 붙이지 않는다(중복 헤더 방지)

# app.conf의 $backend_upstream(요청마다 Docker DNS로 다시 조회하는 백엔드 주소)으로 보낸다
proxy_pass $backend_upstream;

# 백엔드가 원래 요청 정보를 알 수 있게 넘긴다 (로그 · 쿠키 Secure 판단 · 감사 로그 IP — 백엔드가 이 값을 쓰려면
# forward-headers-strategy=native가 필요하다, deploy/README.md "Rate limit"). Rate limit 자체는 이 헤더가 아니라 Nginx가 본 IP를 쓴다
# X-Forwarded-Proto: https server에서 include되면 https가 넘어간다 (BE-75)
# X-Forwarded-Host · Port: 백엔드(forward-headers-strategy=native, BE-62)는 이 헤더를 원래 Host · 포트로 믿는다.
#   Nginx는 따로 정하지 않은 요청 헤더를 그대로 넘기므로, 비워 두면 클라이언트가 보낸 값이 백엔드까지 간다 →
#   카카오 Redirect URI({baseUrl}) · Origin 검증(BE-94)이 조작된 Host를 볼 수 있다. 항상 Nginx가 본 값으로 덮어쓴다 (PR #229 리뷰)
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;

# 백엔드 연결 · 응답 대기 상한. 예전에는 /api/ 쪽에만 있었고 슬래시 없는 /api에는 없어(Nginx 기본 60초) 이번에 맞췄다
# proxy_read_timeout은 backend의 가장 긴 동기 호출(case-photo-prompt.timeout 90s, BE-91)보다 길게 둔다 —
# 짧으면 Gemini 응답이 오기 전에 Nginx가 먼저 502로 끊는다(PR #202 리뷰)
proxy_connect_timeout 5s;
proxy_read_timeout 120s;
