name: backend CI

on:
  pull_request:
    branches: [develop]
    paths:
      - backend/**
      - frontend/og/**  # 성향 OG 빌드 입력. 시드와 같은지 백엔드 테스트가 확인한다 (BE-73)
      - .github/workflows/backend-ci.yml
  push:
    branches: [develop]
    paths:
      - backend/**
      - frontend/og/**
      - .github/workflows/backend-ci.yml
  workflow_dispatch:

# 같은 PR에 새 push가 오면 이전 실행을 취소한다 (CI 전용, 배포 파일에는 쓰지 말 것)
concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test and build image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # 로컬 docker-compose.test.yml과 같은 이미지/DB/호스트 포트를 사용한다
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: lawnambul_test
          POSTGRES_USER: lawnambul_test
          POSTGRES_PASSWORD: lawnambul_test   # CI 안에서만 쓰는 임시 계정
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U lawnambul_test -d lawnambul_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        # 캐시(DB 0) · 토큰(DB 1) 분리 통합 테스트용 (BE-61). 로컬 docker-compose.yml과 같은 이미지를 쓴다
        # 서비스 컨테이너는 command를 받지 못해 정책(AOF · noeviction)은 적용하지 않는다. 정책 확인은 로컬 · 운영 Compose에서 한다
        image: redis:7.4-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # build.gradle이 검증해 테스트 JVM에 주입하는 테스트 전용 변수만 사용한다.
    env:
      TEST_DB_URL: jdbc:postgresql://127.0.0.1:55432/lawnambul_test
      TEST_DB_USERNAME: lawnambul_test
      TEST_DB_PASSWORD: lawnambul_test
      TEST_REDIS_HOST: 127.0.0.1
      TEST_REDIS_PORT: 56379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties

      # DB 제약(부분 유니크 인덱스 · CHECK)을 포함한 통합 테스트가 위 PostgreSQL 서비스 컨테이너에 붙어 실행된다.
      # 부분 유니크 인덱스는 PostgreSQL 전용이라 H2 같은 인메모리 DB로는 검증할 수 없다 (docs/tech-stack.md 7장).
      - name: Run backend tests (PostgreSQL 서비스 컨테이너, DB 제약 검증 포함)
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      # 테스트가 CI에서만 실패했을 때 어느 테스트 · 제약인지 바로 볼 수 있도록 리포트를 남긴다
      # 공개 저장소라 아티팩트는 GitHub 로그인한 누구나 내려받을 수 있다.
      # 테스트는 실제 사건 데이터 · 비밀값을 출력하지 않아야 한다 (CI는 서브모듈을 받지 않음).
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: |
            backend/build/reports/tests/test
            backend/build/test-results/test
          retention-days: 7
          if-no-files-found: ignore

      - uses: docker/setup-buildx-action@v3

      # Dockerfile이 깨지지 않았는지 이미지 빌드만 확인한다 (push 안 함)
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: lawnambul-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
