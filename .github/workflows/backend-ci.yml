name: backend CI

on:
  pull_request:
    branches: [develop]
    paths:
      - backend/**
      - .github/workflows/backend-ci.yml
  push:
    branches: [develop]
    paths:
      - backend/**
      - .github/workflows/backend-ci.yml
  workflow_dispatch:

# 같은 PR에 새 push가 오면 이전 실행을 취소한다 (CI 전용, 배포 파일에는 쓰지 말 것)
concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test and build image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # 로컬 docker-compose.yml과 같은 이미지/버전을 사용한다
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: lawnambul
          POSTGRES_USER: lawnambul
          POSTGRES_PASSWORD: lawnambul   # CI 안에서만 쓰는 임시 계정
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lawnambul -d lawnambul"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # application.yml이 읽는 환경변수 이름과 반드시 일치해야 한다
    env:
      DB_URL: jdbc:postgresql://localhost:5432/lawnambul
      DB_USERNAME: lawnambul
      DB_PASSWORD: lawnambul
      # 개발용 가상 사건 시드(db/seed)도 함께 적용해, 시드가 스키마 제약을 깨지 않는지 CI에서 확인한다 (운영에는 넣지 않음)
      FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/seed

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties

      # DB 제약(부분 유니크 인덱스 · CHECK)을 포함한 통합 테스트가 위 PostgreSQL 서비스 컨테이너에 붙어 실행된다.
      # 부분 유니크 인덱스는 PostgreSQL 전용이라 H2 같은 인메모리 DB로는 검증할 수 없다 (docs/tech-stack.md 7장).
      - name: Run backend tests (PostgreSQL 서비스 컨테이너, DB 제약 검증 포함)
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      # 테스트가 CI에서만 실패했을 때 어느 테스트 · 제약인지 바로 볼 수 있도록 리포트를 남긴다
      # 공개 저장소라 아티팩트는 GitHub 로그인한 누구나 내려받을 수 있다.
      # 테스트는 실제 사건 데이터 · 비밀값을 출력하지 않아야 한다 (CI는 서브모듈을 받지 않음).
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: |
            backend/build/reports/tests/test
            backend/build/test-results/test
          retention-days: 7
          if-no-files-found: ignore

      - uses: docker/setup-buildx-action@v3

      # Dockerfile이 깨지지 않았는지 이미지 빌드만 확인한다 (push 안 함)
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: lawnambul-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
