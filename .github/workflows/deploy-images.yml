name: deploy images

# 운영 이미지 빌드 · 스모크 테스트 · GHCR 업로드 (BE-58, WBS 7.1.1) + 운영 배포 확인 (BE-60, WBS 7.1.3)
# - PR(develop · main 대상): build job만 실행한다. 이미지를 빌드해 운영 구성(deploy/docker-compose.prod.yml)으로 띄우고 스모크 테스트 (업로드 안 함)
# - develop · main push: build job이 스모크 테스트를 통과한 이미지를 파일로 넘기고, publish job이 그 이미지를 GHCR에 올린다
#   (태그: sha-커밋7자리 + 브랜치 이름 develop · main). 다시 빌드하지 않으므로 올라가는 이미지 = 테스트한 이미지
# - 권한 분리: GHCR 쓰기 권한(packages: write)은 publish job에만 있다. PR에서 도는 build job은 읽기 권한뿐이다 (CodeRabbit 리뷰 반영)
# - 운영 배포(BE-60): 서버가 2분마다 GHCR의 main 이미지를 확인해 스스로 배포한다(deploy/cd-agent.sh). Actions는 서버에 들어가지 않는다.
#   main push면 verify-deploy job이 서버의 /version.json이 이 커밋이 될 때까지 기다리고 원격 스모크 테스트로 결과를 확인한다
#   develop 이미지는 올리기만 하고 운영에 배포하지 않는다 (운영 반영은 develop → main PR로만)
on:
  pull_request:
    branches: [develop, main]
    paths:
      - frontend/**
      - backend/**
      - deploy/**
      - .github/workflows/deploy-images.yml
  push:
    branches: [develop, main]
    paths:
      - frontend/**
      - backend/**
      - deploy/**
      - .github/workflows/deploy-images.yml
  workflow_dispatch:

# PR 검증은 새 push가 오면 이전 실행을 취소하고, 이미지 업로드(develop)는 중간에 끊지 않는다
concurrency:
  group: deploy-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 기본 권한은 읽기만. 쓰기 권한은 publish job에서만 따로 준다
permissions:
  contents: read

env:
  # GHCR 이미지 이름 앞부분 (소문자만 허용). 서버의 deploy/.env IMAGE_PREFIX와 같아야 한다
  # 지금 조직명(prgrms-aibe-devcourse)은 소문자라 그대로 쓴다. fork · 조직 이전으로 대문자가 섞이면
  # 이 줄을 소문자 고정 문자열로 바꾼다 (Actions 식에는 소문자 변환 함수가 없다)
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/lawnambul
  # 이 실행에서만 쓰는 태그. 스모크 테스트를 통과하면 publish job이 sha · 브랜치 태그를 붙여 올린다
  IMAGE_TAG: ci-${{ github.sha }}
  # 이미지를 올리는 실행인지 (develop · main push 또는 그 브랜치에서 수동 실행). PR에서는 false
  PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') }}

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # 토큰을 로컬 git 설정에 남기지 않는다 (이 job은 git push를 하지 않는다)
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      # 라벨: source = 패키지 페이지에서 저장소로 연결, revision = 이미지의 커밋 (서버의 cd-agent.sh가 이 값으로 배포할 sha 태그를 정한다)
      # GIT_SHA: web 이미지의 /version.json에 들어간다 (verify-deploy job이 배포 확인에 쓴다)
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          push: false
          tags: ${{ env.IMAGE_PREFIX }}-web:${{ env.IMAGE_TAG }}
          build-args: GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          push: false
          tags: ${{ env.IMAGE_PREFIX }}-backend:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # 운영과 같은 구성으로 띄운다. DB · Redis 비밀번호는 이 실행에서만 쓰는 무작위 값 (로그에 남지 않게 마스킹)
      - name: Start stack (production compose)
        working-directory: deploy
        run: |
          DB_PASSWORD_CI="$(openssl rand -hex 16)"
          REDIS_PASSWORD_CI="$(openssl rand -hex 16)"
          echo "::add-mask::$DB_PASSWORD_CI"
          echo "::add-mask::$REDIS_PASSWORD_CI"
          {
            echo "IMAGE_PREFIX=$IMAGE_PREFIX"
            echo "IMAGE_TAG=$IMAGE_TAG"
            echo "WEB_PORT=80"
            echo "POSTGRES_PASSWORD=$DB_PASSWORD_CI"
            echo "REDIS_PASSWORD=$REDIS_PASSWORD_CI"
          } > .env
          docker compose -f docker-compose.prod.yml up -d --no-build

      # 백엔드 기동(Flyway 마이그레이션 포함)을 기다린다. 최대 2분, 요청 하나는 5초 안에 끝낸다
      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            if [ "$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' http://localhost/api/v1/cases)" = "200" ]; then
              echo "ready after $((i * 2))s"; exit 0
            fi
            sleep 2
          done
          echo "백엔드가 2분 안에 뜨지 않았다"; exit 1

      - name: Smoke test
        run: ./deploy/smoke-test.sh http://localhost

      # 배포 확인용 버전 파일 (BE-60): 이 커밋이 들어 있고, 캐시 금지여야 verify-deploy job이 운영 반영을 판단할 수 있다
      - name: Check version.json
        run: |
          headers="$(curl -sS --max-time 5 -D - -o version.json http://localhost/version.json)"
          cat version.json
          grep -q "\"revision\":\"$GITHUB_SHA\"" version.json || { echo "version.json에 이 커밋($GITHUB_SHA)이 없다"; exit 1; }
          grep -qi '^cache-control: no-store' <<<"$headers" || { echo "version.json이 no-store가 아니다"; exit 1; }

      # 실패 원인을 바로 볼 수 있게 컨테이너 상태 · 로그를 남긴다 (비밀값은 로그에 출력되지 않는다)
      - name: Show logs on failure
        if: failure()
        working-directory: deploy
        run: |
          docker compose -f docker-compose.prod.yml ps
          docker compose -f docker-compose.prod.yml logs --no-color --tail=200

      - name: Stop stack
        if: always()
        working-directory: deploy
        run: docker compose -f docker-compose.prod.yml down -v

      # ---------- develop · main push에서만: 테스트한 이미지를 publish job으로 넘긴다 ----------
      # 이미지에는 비밀값이 없다(비밀값은 실행 시 .env로 주입). 하루 뒤 자동 삭제
      - name: Save tested images
        if: env.PUBLISH == 'true'
        run: docker save "$IMAGE_PREFIX-web:$IMAGE_TAG" "$IMAGE_PREFIX-backend:$IMAGE_TAG" | gzip > images.tar.gz

      - name: Upload tested images
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tested-images
          path: images.tar.gz
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Push to GHCR
    needs: build
    # develop · main에 머지(push)됐을 때만. PR에서는 이 job 자체가 실행되지 않는다 (job의 if에서는 env를 못 써서 조건을 그대로 적는다)
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write   # GHCR 업로드에만 쓴다. 코드는 checkout하지 않는다

    steps:
      - name: Download tested images
        uses: actions/download-artifact@v4
        with:
          name: tested-images

      - name: Load tested images
        run: gunzip -c images.tar.gz | docker load

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 순서가 중요하다 (BE-60): sha 태그를 둘 다 먼저 올리고, 브랜치 태그(main)는 마지막에 옮긴다.
      # 서버는 web:main이 바뀌는 것을 보고 그 커밋의 sha 태그를 받는데, sha 태그가 아직 없으면 받기에 실패해 2분 뒤 다시 시도하게 된다
      - name: Push images (sha-xxxxxxx, then branch tag)
        env:
          BRANCH_TAG: ${{ github.ref_name }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          for tag in "sha-$SHORT_SHA" "$BRANCH_TAG"; do
            for name in backend web; do
              docker tag "$IMAGE_PREFIX-$name:$IMAGE_TAG" "$IMAGE_PREFIX-$name:$tag"
              docker push "$IMAGE_PREFIX-$name:$tag"
            done
          done

  # ---------- 운영 배포 확인 (BE-60): main push에서만 ----------
  # 배포는 서버가 한다(cd-agent.sh, 2분마다 확인). 이 job은 서버에 들어가지 않고, 공개된 80번으로 결과만 본다:
  # 1) /version.json이 이 커밋이 될 때까지 기다린다 (서버 확인 주기 2분 + 이미지 받기 + 기동 대기 + 실패 시 되돌림까지 15분)
  # 2) 바뀌면 운영 주소로 스모크 테스트
  # 시간 안에 안 바뀌면 실패로 표시한다 — 원인은 서버 로그(journalctl -u lawnambul-cd)에 있다 (배포 실패 → 되돌림, 토큰 만료 등)
  # 운영 주소는 저장소 변수 DEPLOY_URL(예: http://<탄력적 IP>)에 둔다. 비어 있으면 확인을 건너뛴다(배포 자체는 서버가 한다)
  verify-deploy:
    name: Verify production deploy
    needs: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Wait for server to deploy this commit
        id: wait
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::notice::저장소 변수 DEPLOY_URL이 없어 운영 배포 확인을 건너뛴다 (배포는 서버가 따로 한다)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for i in $(seq 1 60); do
            revision="$(curl -s --max-time 5 "$DEPLOY_URL/version.json" | sed -n 's/.*"revision":"\([0-9a-f]*\)".*/\1/p')"
            if [ "$revision" = "$GITHUB_SHA" ]; then
              echo "운영에 반영됨 ($((i * 15))초)"; exit 0
            fi
            sleep 15
          done
          echo "::error::15분 안에 운영이 이 커밋(${GITHUB_SHA::7})으로 바뀌지 않았다. 지금 운영: ${revision:-응답 없음}. 서버에서 journalctl -u lawnambul-cd 로 확인"
          exit 1

      - name: Smoke test (production)
        if: steps.wait.outputs.skip != 'true'
        run: ./deploy/smoke-test.sh "$DEPLOY_URL"
