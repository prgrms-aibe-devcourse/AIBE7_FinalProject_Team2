# 메인 EC2에서 돌리는 모니터링 에이전트 (COMMON-43 WBS 7.2.4, Grafana Cloud 전환 · 운영 반영 COMMON-64).
# docker-compose.prod.yml 위에 겹쳐 쓴다 — docker-compose.real-seed.yml과 같은 방식이다.
#
#   ./deploy.sh --reapply     ← .env에 값을 넣은 뒤 이걸로 적용한다
#
# 손으로 `docker compose -f docker-compose.prod.yml -f docker-compose.monitoring-agent.yml up -d`를 치지 않는다 —
# 운영은 외부 DB 오버레이(docker-compose.external-db.yml) 등도 함께 붙어 있어서, 그걸 빼고 올리면 backend가
# 정지된 postgres를 찾다가 내려간다. deploy.sh가 .env 플래그를 보고 필요한 오버레이를 모두 붙인다.
#
# ⚠️ 이 오버레이는 "붙여서 올릴 때만" 적용된다. base 파일만으로 backend를 다시 올리면 로그 볼륨이
# 빠진 채로 컨테이너가 재생성되고, **모니터링이 조용히 끊긴다**(에이전트 컨테이너만 연결 없이 남는다).
# D가 COMMON-43 협의에서 짚은 위험이고, BE-60 CD가 들어온 지금은 가설이 아니라 상시 위험이다 —
# `cd-agent.sh`가 2분마다 GHCR `main` 이미지를 확인해 `deploy.sh`로 자동 배포하기 때문이다.
#
# 그래서 `deploy.sh`의 COMPOSE 배열이 `.env`의 MONITORING_AGENT=1을 보고 이 파일을 포함하게 해 두었다
# (real-seed 오버레이 바로 뒤, PR #168 리뷰 반영). 이 서버에서 에이전트를 쓰려면 `.env`에 아래 값이 필요하다.
#
#   MONITORING_AGENT=1
#   GRAFANA_CLOUD_PROM_URL=<remote_write 주소>      GRAFANA_CLOUD_LOKI_URL=<Loki push 주소>
#   GRAFANA_CLOUD_PROM_USERNAME=<Instance ID>       GRAFANA_CLOUD_LOKI_USERNAME=<Loki User ID>
#   GRAFANA_CLOUD_PROM_API_KEY=<토큰>                GRAFANA_CLOUD_LOKI_API_KEY=<토큰, 비우면 지표 토큰을 같이 씀>
#
# MONITORING_AGENT=1인데 필수 값이 없으면 deploy.sh가 배포를 시작하기 전에 멈춘다 — 자동 배포가
# 애먼 이유로 실패한 것처럼 보이지 않게 하기 위해서다. 값을 넣지 않은 서버에서는 분기 자체가 타지 않으므로
# 기존 배포 동작은 그대로다.
#
# 수집 · 저장 · 경보는 Grafana Cloud에 있다(COMMON-43 1순위 → COMMON-62 · 63 · 64). 여기에는 "메인 서버에
# 있어야만 되는 것" 둘만 둔다.
#   - alloy: 로그 파일을 읽어 보내고(push), 같은 Docker 네트워크 안에서 backend:8081 · node-exporter:9100을
#     직접 긁어(scrape) 지표도 보낸다(remote_write). 그래서 **호스트로 여는 포트가 하나도 없다** —
#     전용 모니터링 EC2(차선, 안 씀)를 전제로 열던 8081 · 9100과 MAIN_PRIVATE_IP는 COMMON-64에서 지웠다
#   - node-exporter: 봐야 할 자원이 이 서버의 CPU · 메모리 · 디스크다
#
# 메모리: 둘 다 에이전트라 가볍다(합쳐서 100MB 남짓). 저장·인덱싱을 하는 쪽이 전부 빠졌기 때문에,
# t3.small에서 실측 사용량 기준 여유(약 250MB) 안에서 돈다. mem_limit은 예약이 아니라 상한이라
# (백엔드 1.75GB + 두 에이전트 192m + 64m을 더하면 2GB를 넘는다), 상한을 걸어 백엔드를 밀어내지 못하게 하는 용도다.

services:
  # base 파일(docker-compose.prod.yml)의 backend에 로그 볼륨 하나만 더한다. 나머지 설정은 그대로다.
  # 관리 포트(8081)는 호스트로 열지 않는다 — Alloy가 같은 네트워크에서 backend:8081로 바로 읽는다 (COMMON-64)
  backend:
    volumes:
      # 백엔드가 로그를 쓰는 /app/logs를 Alloy와 공유한다
      - backend-logs:/app/logs

  # 웹(Nginx)의 429 전용 로그를 Alloy와 공유한다 (BE-63). 평소 접속 기록(stdout)은 그대로다
  web:
    volumes:
      - web-ratelimit-logs:/var/log/nginx-ratelimit

  alloy:
    image: grafana/alloy:v1.14.1
    container_name: lawnambul-alloy
    volumes:
      - ./alloy-agent.alloy:/etc/alloy/config.alloy:ro
      # 백엔드가 쓰고 Alloy는 읽기만 한다
      - backend-logs:/var/log/backend:ro
      # 웹 429 전용 로그 (BE-63). 웹이 쓰고 Alloy는 읽기만 한다. 크기 상한은 웹의 41-trim-rate-limit-log.sh
      - web-ratelimit-logs:/var/log/web:ro
      # --storage.path 자리. 여기에 loki.source.file의 읽은 위치와 loki.write WAL이 쌓인다.
      # 볼륨이 없으면 이미지 교체 등으로 컨테이너가 재생성될 때마다 위치 기록이 사라져,
      # 기본 동작대로 로그 파일을 처음부터 다시 읽어 Loki에 같은 로그가 또 들어간다 (PR #168 리뷰 반영)
      - alloy-data:/var/lib/alloy/data
    environment:
      # Grafana Cloud 주소 · 인증 (COMMON-62 · 64). 값은 서버 deploy/.env에만 둔다 — 저장소 · 채팅에 남기지 않는다.
      # 파일(password_file)이 아니라 환경변수로 넘기는 이유: 비밀값 파일을 컨테이너 사용자가 못 읽는 문제(PR #262)를 피한다
      GRAFANA_CLOUD_PROM_URL: ${GRAFANA_CLOUD_PROM_URL:?deploy/.env에 GRAFANA_CLOUD_PROM_URL이 필요하다}
      GRAFANA_CLOUD_PROM_USERNAME: ${GRAFANA_CLOUD_PROM_USERNAME:?deploy/.env에 GRAFANA_CLOUD_PROM_USERNAME(Instance ID)이 필요하다}
      GRAFANA_CLOUD_PROM_API_KEY: ${GRAFANA_CLOUD_PROM_API_KEY:?deploy/.env에 GRAFANA_CLOUD_PROM_API_KEY가 필요하다}
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL:?deploy/.env에 GRAFANA_CLOUD_LOKI_URL이 필요하다}
      GRAFANA_CLOUD_LOKI_USERNAME: ${GRAFANA_CLOUD_LOKI_USERNAME:?deploy/.env에 GRAFANA_CLOUD_LOKI_USERNAME(Loki User ID)이 필요하다}
      # 비우면 alloy-agent.alloy가 지표 토큰(GRAFANA_CLOUD_PROM_API_KEY)을 같이 쓴다 — logs:write 범위가 있어야 한다
      GRAFANA_CLOUD_LOKI_API_KEY: ${GRAFANA_CLOUD_LOKI_API_KEY:-}
      # 지표 · 로그의 env 라벨. 이 오버레이는 운영 서버 전용이라 기본값이 prod다 (로컬 테스트는 이 파일을 쓰지 않는다)
      MONITORING_ENV: ${MONITORING_ENV:-prod}
    command:
      - run
      # Alloy 자체 UI(12345)는 컨테이너 안에서만 연다 — 포트를 밖으로 내보내지 않는다.
      # 확인이 필요하면 docker exec로 들어가거나 docker logs를 본다
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      # Alloy는 기본으로 Grafana에 사용 통계를 보낸다("running usage stats reporter"). 서비스 호스트에서
      # 바깥으로 나가는 연결을 만들지 않는다 — Grafana 쪽 GF_ANALYTICS_* 를 끈 것과 같은 기준이다
      - --disable-reporting
      - /etc/alloy/config.alloy
    restart: unless-stopped
    # 192m는 D 요청값이다(COMMON-43 협의) — Alloy · node_exporter 합쳐 150MB 정도로 보고,
    # 메인 서버 여유 메모리를 넘지 않도록 상한을 반드시 건다
    mem_limit: 192m

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: lawnambul-node-exporter
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(rootfs/)?(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($$|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|cgroup.?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$
    restart: unless-stopped
    mem_limit: 64m

volumes:
  backend-logs:
  # 웹 429 전용 로그 (BE-63)
  web-ratelimit-logs:
  # Alloy의 읽은 위치 · WAL (alloy-agent.alloy의 wal 블록). 지우면 로그가 중복 적재된다
  alloy-data:
