# 운영 구성 (BE-58, WBS 7.1.1): Nginx(웹) · Spring Boot(백엔드) · PostgreSQL · Redis(BE-61, WBS 7.1.4) 한 대 구성
# 사용법 · 환경변수는 deploy/README.md 참고. 비밀값은 deploy/.env(커밋 안 함)로만 넘긴다.
#
# - 이미지는 GitHub Actions(deploy-images.yml)가 빌드해 GHCR에 올리고, 서버는 pull해서 실행만 한다(서버에서 Gradle 빌드 안 함)
# - 로컬 · CI 스모크 테스트에서는 build:로 같은 이미지를 직접 만든다 (docker compose build)
# - 밖으로 여는 포트는 웹 80 · 443뿐이다(443은 BE-75). 백엔드 8080 · DB 5432 · Redis 6379는 컨테이너 내부 네트워크에서만 쓴다 (보안 그룹도 80 · 443 · 22만)
# - 7.1.2에서 DB를 RDS로 옮기면 postgres 서비스를 빼고 DB_URL만 RDS 주소로 바꾼다
# - Redis는 캐시(DB 0) · 토큰 저장소(DB 1)로 나눠 쓴다. 정책은 docs/tech-stack.md 2장 "Redis 운영 구성"

name: lawnambul

services:
  web:
    image: ${IMAGE_PREFIX:-lawnambul}-web:${IMAGE_TAG:-local}
    build:
      context: ../frontend
    ports:
      - "${WEB_PORT:-80}:80"
      # HTTPS (BE-75). 인증서가 없으면 컨테이너 안에서 443을 듣지 않아 접속이 거절될 뿐, http에는 영향이 없다
      - "${WEB_HTTPS_PORT:-443}:443"
    environment:
      # 이 값 + 서버의 인증서가 있을 때만 컨테이너 시작 시 https를 켠다 (frontend/nginx/40-enable-https.sh)
      # 비어 있으면(CI · 로컬) 지금처럼 http만 뜬다
      SERVER_DOMAIN: ${SERVER_DOMAIN:-}
      # 429 전용 로그 크기 상한(바이트, BE-63 — frontend/nginx/41-trim-rate-limit-log.sh). 비워 두면 10MB
      RATE_LIMIT_LOG_MAX_BYTES: ${RATE_LIMIT_LOG_MAX_BYTES:-10485760}
    volumes:
      # 서버 호스트의 certbot이 발급 · 갱신하는 인증서. 읽기만 한다 (deploy/README.md "HTTPS")
      # - live/(최신 인증서를 가리키는 링크)와 archive/(실제 파일)만 붙인다. live/의 링크가 ../../archive/를 가리키므로
      #   둘 다 같은 자리에 있어야 열린다. certbot 계정 키가 있는 accounts/ · 설정(renewal/)은 컨테이너에 넣지 않는다(최소 권한)
      # - .env에 경로가 없으면(CI · 로컬) 빈 이름 있는 볼륨이 붙는다 → 인증서 없음 → http만
      - ${LETSENCRYPT_LIVE_DIR:-letsencrypt-live}:/etc/letsencrypt/live:ro
      - ${LETSENCRYPT_ARCHIVE_DIR:-letsencrypt-archive}:/etc/letsencrypt/archive:ro
      # Let's Encrypt 도메인 확인 파일 폴더. 호스트 certbot이 쓰고 Nginx가 /.well-known/acme-challenge/로 내준다
      - ${CERTBOT_WEBROOT:-certbot-webroot}:/var/www/certbot:ro
    # 백엔드가 준비(healthy)된 뒤에 웹을 띄운다 (BE-60). 새 이미지로 바꿀 때 웹이 먼저 떠서 /api가 502를 내는 시간을 줄인다.
    # - Nginx는 백엔드 주소를 요청마다 다시 조회하므로(default.conf resolver) 백엔드만 다시 떠도 그 뒤 요청은 정상 전달된다
    # - 백엔드가 끝내 준비되지 않으면 웹은 바뀌지 않고, deploy.sh가 직전 이미지로 되돌린다
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    image: ${IMAGE_PREFIX:-lawnambul}-backend:${IMAGE_TAG:-local}
    build:
      context: ../backend
    environment:
      # application.yml이 읽는 이름과 같아야 한다
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lawnambul}
      DB_USERNAME: ${POSTGRES_USER:-lawnambul}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?deploy/.env에 POSTGRES_PASSWORD를 넣어야 한다}
      # 기본은 스키마만. .env로 바꿀 수 없게 고정한다 — 개발용 가상 사건 시드(classpath:db/seed)는 운영에 넣지 않는다 (docs/tech-stack.md 2장)
      # 실제 사건은 docker-compose.real-seed.yml을 겹쳐 실행할 때만 filesystem: 위치로 추가된다
      FLYWAY_LOCATIONS: classpath:db/migration
      # Redis (BE-61). 호스트는 Compose 서비스 이름. 비밀번호는 redis 서비스와 같은 값
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?deploy/.env에 REDIS_PASSWORD를 넣어야 한다}
      # 관리자 세션 쿠키 Secure. HTTPS 적용 전에는 브라우저가 Secure 쿠키를 저장하지 않는다 (README "HTTPS" 참고)
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      # 없으면 RAG 유사 판례 검색만 꺼지고 서버는 뜬다
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # 파일 저장소 S3 (COMMON-47). 버킷 이름은 deploy/.env에만 둔다. 비어 있으면 S3를 쓰는 기능만 동작하지 않는다
      # - 인증은 EC2 IAM 역할로 한다. AWS_ACCESS_KEY_ID · AWS_SECRET_ACCESS_KEY는 넣지 않는다(넣으면 역할보다 먼저 쓰인다)
      # - 컨테이너가 역할 자격증명을 받으려면 인스턴스 메타데이터 홉 제한이 2 이상이어야 한다 (deploy/README.md "파일 저장소 S3")
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      # 첫 관리자 계정 (BE-39). 처음 한 번만 넣고, 계정이 만들어지면 .env에서 지운다
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      # 회원 JWT 서명 키 (확장 단계, BE-94). application.yml이 기본값을 두지 않으므로(공개 저장소 노출 방지) 여기서도
      # 값이 없으면 기동을 막는다. deploy/.env에 openssl rand -base64 32로 만든 값을 넣는다
      JWT_SECRET: ${JWT_SECRET:?deploy/.env에 JWT_SECRET을 넣어야 한다 (openssl rand -base64 32)}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-14d}
      # 카카오 로그인 (확장 단계, BE-62). 비어 있으면 카카오 로그인 경로만 꺼지고 서버는 뜬다.
      # ID를 넣으면 SECRET도 필수다(없으면 백엔드 기동 실패). 카카오 콘솔 Redirect URI: https://<도메인>/api/v1/auth/oauth2/callback/kakao
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      # 운영에서 API 문서를 열지 않는다 (application.yml 기본값과 같음, 명시만)
      SWAGGER_ENABLED: "false"
      # 서버 메모리(t3.small 2GB)에 맞춰 JVM 힙 상한을 컨테이너 메모리 비율로 둔다
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
    depends_on:
      postgres:
        condition: service_healthy
      # 토큰 저장소가 준비된 뒤에 뜬다 (캐시만이라면 없어도 뜨지만, 로그인 기능이 Redis를 원본처럼 쓴다)
      redis:
        condition: service_healthy
    # 준비 확인 (BE-60): 관리 포트(8081, 밖으로 열지 않음)의 readiness. 이미지에 curl이 있다(eclipse-temurin:17-jre)
    # - /actuator/health(전체)가 아니라 readiness를 쓴다: 전체 상태는 Redis 장애 때 DOWN(503)이 되지만 API는 정상이다.
    #   readiness · liveness는 Redis가 꺼져도 UP이다 (BE-61 실측, deploy/README.md)
    # - start_period: 기동(Flyway 포함) 중 실패는 세지 않는다. t3.small 실측 22초(10/16), 여유를 둔다
    # - unhealthy가 돼도 Docker가 재시작하지는 않는다(restart는 프로세스가 죽을 때만). 판단은 deploy.sh가 한다
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "-o", "/dev/null", "http://localhost:8081/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 120s
    restart: unless-stopped
    mem_limit: 1g
    # swap을 쓰지 않는다 (COMMON-54). 값을 안 주면 서버에 swap이 있을 때 Docker가 mem_limit만큼 swap을 더 허용한다 —
    # JVM 힙이 swap으로 밀리면 GC가 디스크를 기다려 응답이 수십 초씩 멈추고, 죽지는 않아 재시작도 안 되는 "느린 서버"가 된다.
    # mem_limit과 같게 두면 swap을 켜기 전과 동작이 같다(넘으면 지금처럼 OOM으로 재시작). 서버 swap은 호스트 · 파이프라인 몫이다
    memswap_limit: 1g

  postgres:
    # 로컬 backend/docker-compose.yml · CI와 같은 이미지 (RDS PostgreSQL 17과 맞춘 태그)
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lawnambul}
      POSTGRES_USER: ${POSTGRES_USER:-lawnambul}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?deploy/.env에 POSTGRES_PASSWORD를 넣어야 한다}
    volumes:
      - pgdata:/var/lib/postgresql/data   # 컨테이너를 다시 만들어도 데이터 유지
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    mem_limit: 512m
    # swap을 쓰지 않는다 (COMMON-54, backend와 같은 이유 — 쿼리 중 페이지가 swap에 있으면 지연이 튄다)
    memswap_limit: 512m

  redis:
    # 로컬 backend/docker-compose.yml · CI와 같은 이미지. 정책은 로컬과 같고 비밀번호만 더한다
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?deploy/.env에 REDIS_PASSWORD를 넣어야 한다}
      # redis-cli(헬스체크 · 운영자 접속)가 이 값으로 인증한다. 명령줄에 비밀번호를 쓰지 않아도 된다
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    # 비밀번호를 컨테이너 안에서 환경변수로 읽는다($$ = Compose가 치환하지 않음). 그래서 실행 명령(docker inspect의 Cmd)에는
    # 변수 이름만 남고, 서버의 ps에도 Redis가 실행 인자를 지워 "redis-server *:6379"로만 보인다.
    # 단, 환경변수(docker inspect의 Env)로는 값이 보인다 — PostgreSQL 비밀번호와 같다. docker 명령을 쓸 수 있으면 root와 같으므로
    # 보호선은 서버 접근 자체다: .env는 chmod 600, docker 그룹에는 배포 담당만 넣는다 (deploy/README.md)
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --requirepass "$$REDIS_PASSWORD"
        --appendonly yes
        --appendfsync everysec
        --maxmemory 200mb
        --maxmemory-policy noeviction
    # appendonly · appendfsync: AOF로 1초마다 기록 → 재시작 · 배포 후에도 토큰(DB 1)이 남는다
    # maxmemory-policy noeviction: 꽉 차도 키를 지우지 않는다(토큰 보호). 대신 모든 키에 TTL 필수
    volumes:
      - redisdata:/data   # 컨테이너를 다시 만들어도 AOF 유지
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # t3.small 2GB: 백엔드 1g · PostgreSQL 512m · Redis 256m. maxmemory(200mb)와 컨테이너 상한 사이의 56MB는 Redis 자체 사용분과
    # AOF 재작성(fork) 때 바뀐 페이지 복사분이다. 데이터가 작을 때(지금은 수 MB)는 넉넉하지만, 사용량이 150MB를 넘으면
    # 재작성 중 컨테이너가 메모리 초과로 죽을 수 있으니 점검한다 (deploy/README.md "Redis")
    mem_limit: 256m
    # swap을 쓰지 않는다 (COMMON-54). Redis는 메모리 안에서 동작한다는 전제로 maxmemory · AOF 재작성 여유를 계산했다 —
    # swap으로 밀리면 단일 스레드라 모든 요청이 같이 느려진다. 넘으면 지금처럼 컨테이너가 재시작된다
    memswap_limit: 256m

volumes:
  pgdata:
  redisdata:
  # HTTPS (BE-75): .env에 LETSENCRYPT_LIVE_DIR · LETSENCRYPT_ARCHIVE_DIR · CERTBOT_WEBROOT가 없을 때(CI · 로컬) 대신 붙는 빈 볼륨.
  # 서버는 .env에 호스트 경로(/etc/letsencrypt/live · /etc/letsencrypt/archive · /var/www/certbot)를 넣으므로 쓰지 않는다
  letsencrypt-live:
  letsencrypt-archive:
  certbot-webroot:
